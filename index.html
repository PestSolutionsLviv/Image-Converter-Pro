<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#090d16" />
    <meta name="description" content="100% In-Browser & Private File Converter. Конвертер фото (HEIC, RAW, JPG, PNG, WebP), документів (DOCX, PDF, TXT) та відео/аудіо без передачі файлів на сервер." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Universal Converter Pro - 100% Client-Side Media & Document Converter</title>

    <script>
      // Clear old caches & update ServiceWorker
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            reg.update();
          }).catch(function() {});
        });
      }

      // Auto-recover from stale chunks after new deployments
      window.addEventListener('vite:preloadError', function() {
        window.location.reload();
      });
      window.addEventListener('error', function(e) {
        if (e && e.message && (e.message.includes('Loading chunk') || e.message.includes('MIME type'))) {
          if (!sessionStorage.getItem('chunk_recovered')) {
            sessionStorage.setItem('chunk_recovered', '1');
            window.location.reload();
          }
        }
      });
    </script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #090d16;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .app-loader-skeleton {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: radial-gradient(circle at 50% 30%, #1e293b 0%, #090d16 100%);
      }
      .app-spinner {
        width: 38px;
        height: 38px;
        border: 3px solid rgba(59, 130, 246, 0.2);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: app-spin 0.75s linear infinite;
      }
      @keyframes app-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loader-skeleton">
        <div class="app-spinner"></div>
        <div style="font-size: 13px; font-weight: 700; color: #60a5fa; letter-spacing: 0.5px;">Universal Converter Pro</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
