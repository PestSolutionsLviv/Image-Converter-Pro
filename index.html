<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Універсальний локальний конвертер фотографій (HEIC, RAW, JPG, PNG, WebP), аудіо, відео, документів, а також конвертер величин та курсів валют 100% у браузері." />
    <title>Universal Converter Pro - Конвертер Зображень, Валют та Величин</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #0f172a;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .app-loader-skeleton {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: radial-gradient(circle at 50% 30%, #1e293b 0%, #0f172a 100%);
      }
      .app-spinner {
        width: 38px;
        height: 38px;
        border: 3px solid rgba(59, 130, 246, 0.2);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: app-spin 0.75s linear infinite;
      }
      @keyframes app-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loader-skeleton">
        <div class="app-spinner"></div>
        <div style="font-size: 13px; font-weight: 700; color: #60a5fa; letter-spacing: 0.5px;">Universal Converter Pro</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
